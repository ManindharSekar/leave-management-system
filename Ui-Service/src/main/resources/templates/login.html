<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div style="max-width:400px; margin:auto; padding:20px; border:1px solid #ddd; border-radius:8px;">
    <h2 style="text-align:center;">Login</h2>

    <!-- Normal form login (if using username/password with Spring Security) -->
    <form th:action="@{login}" method="post">
      <div>
        <label>Username:</label>
        <input type="text" name="username" required/>
      </div>
      <div>
        <label>Password:</label>
        <input type="password" name="password" required/>
      </div>
      <div style="margin-top:10px;">
        <button type="submit">Login</button>
      </div>
    </form>

    <hr>

    <!-- OAuth2 login options -->
    <h3 style="text-align:center;">Or login with</h3>
    <div style="text-align:center;">
      <a th:href="@{/oauth2/authorization/google}">
        <button type="button">Login with Google</button>
      </a>
      <a th:href="@{/oauth2/authorization/github}">
        <button type="button">Login with GitHub</button>
      </a>
    </div>
  </div>
</body>
</html>
