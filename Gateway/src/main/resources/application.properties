spring.application.name=Gateway

server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
spring.cloud.gateway.discovery.locator.enabled=false
spring.cloud.netflix.eureka.discovery.enabled=true

# Routes
spring.cloud.gateway.routes[0].id=config-server
spring.cloud.gateway.routes[0].uri=lb://CONFIG-SERVER
spring.cloud.gateway.routes[0].predicates[0]=Path=/

spring.cloud.gateway.routes[1].id=Ui-Service
spring.cloud.gateway.routes[1].uri=lb://UI-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/login/**

spring.cloud.gateway.routes[2].id=AuthService
spring.cloud.gateway.routes[2].uri=lb://AUTHSERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/


